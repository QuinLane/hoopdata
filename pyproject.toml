[project]
name = "hoopdata"
version = "0.1.0"
description = "Local NBA stats pipeline with a shared DuckDB store"
readme = "README.md"
authors = [
    { name = "quin", email = "64812179+QuinLane@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "nba-api>=1.12.0",
    "pandas>=3.1.1",
]

[project.scripts]
hoopdata = "hoopdata.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
